<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Создай свою компанию 3D</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; color: #fff; user-select: none; }
#game-container { position: fixed; inset: 0; z-index: 1; }

/* Интерфейс поверх 3D */
#ui-layer { position: fixed; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
#ui-layer > * { pointer-events: auto; }

/* Верхняя панель (HUD) */
#hud { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.hud-box { background: rgba(10, 15, 30, 0.8); backdrop-filter: blur(5px); padding: 8px 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); font-weight: bold; font-size: 16px; color: #4ade80; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
#staff-info { font-size: 14px; color: #fff; display: none; background: rgba(10, 15, 30, 0.8); padding: 8px 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); }
#status-badge { font-size: 12px; color: #000; background: #fbbf24; padding: 8px 15px; border-radius: 10px; display: none; font-weight: bold; text-transform: uppercase; box-shadow: 0 0 15px #fbbf24; }

/* Нижняя панель (Кнопки) */
#bottom-panel { display: flex; gap: 10px; justify-content: center; }
.btn { padding: 12px 20px; border: none; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
.btn:active { transform: scale(0.95); }
.btn-hire { background: #3b82f6; color: #fff; }
.btn-upgrade { background: #eab308; color: #000; }

/* Экраны (Меню, Пролог) */
.screen { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); padding: 20px; overflow-y: auto; text-align: center; }
.screen.hidden { display: none; }
.screen h1, .screen h2 { font-size: 26px; margin-bottom: 15px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
.screen p { font-size: 16px; line-height: 1.4; margin-bottom: 15px; max-width: 500px; }
.screen label { font-size: 14px; color: #aaa; text-align: left; width: 100%; max-width: 400px; margin-top: 10px; }
.screen input, .screen textarea { width: 100%; max-width: 400px; padding: 12px; border: 1px solid #444; border-radius: 10px; background: rgba(255,255,255,0.1); color: #fff; font-size: 16px; font-family: inherit; margin-top: 5px; outline: none; }
.screen textarea { min-height: 80px; resize: none; }
.screen button { width: 100%; max-width: 400px; margin-top: 15px; padding: 14px; border: none; border-radius: 10px; background: #4ade80; color: #000; font-size: 16px; font-weight: bold; cursor: pointer; }

/* Компактный телефон */
.phone-mockup { width: 100%; max-width: 320px; background: #fff; border-radius: 20px; border: 6px solid #333; overflow: hidden; color: #000; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.8); max-height: 90vh; }
.phone-header { background: #3b82f6; color: #fff; padding: 12px; text-align: center; font-weight: bold; font-size: 16px; }
.phone-body { padding: 15px; display: flex; flex-direction: column; background: #f8f9fa; overflow-y: auto; }
.phone-body p { font-size: 14px; margin-bottom: 5px; font-weight: bold; color: #555; text-align: left; }
.phone-body textarea { background: #fff; border: 1px solid #ccc; color: #000; min-height: 80px; margin-bottom: 10px; }
.phone-body button { background: #3b82f6; color: #fff; margin-top: 0; padding: 12px; }

#rotate-hint { display: none; position: fixed; inset: 0; background: #000; z-index: 999; align-items: center; justify-content: center; font-size: 20px; text-align: center; padding: 20px; }
@media (orientation: portrait) { #rotate-hint { display: flex; } }
</style>
</head>
<body>

<!-- 3D Сцена -->
<div id="game-container"></div>

<!-- Интерфейс -->
<div id="ui-layer">
  <div id="hud">
    <div class="hud-box" id="money-box">$1 000 000</div>
    <div id="staff-info">Сотрудников: 1 / 15</div>
    <div id="status-badge">💎 Скин Богача</div>
  </div>
  <div id="bottom-panel">
    <button id="btn-hire" class="btn btn-hire">Нанять ещё ($50 000)</button>
    <button id="btn-upgrade" class="btn btn-upgrade">Улучшить офис ($100 000)</button>
  </div>
</div>

<!-- Экраны -->
<div id="screen-prolog" class="screen">
  <h2 id="prolog-title">Пролог</h2>
  <p id="prolog-text">Ты возвращаешься домой и замечаешь пустой ничейный участок рядом.</p>
  <button id="btn-prolog-next">Далее</button>
</div>

<div id="screen-create" class="screen hidden">
  <h1>Создай свою компанию</h1>
  <label>Название</label>
  <input id="input-name" type="text" maxlength="20" placeholder="Например: FutureTech">
  <label>Что делает ваша компания?</label>
  <textarea id="input-desc" maxlength="150" placeholder="Разработка игр..."></textarea>
  <button id="btn-create">Основать компанию</button>
</div>

<div id="screen-phone" class="screen hidden">
  <div class="phone-mockup">
    <div class="phone-header">Соцсеть</div>
    <div class="phone-body">
      <p>Напиши вакансию:</p>
      <textarea id="input-vacancy" maxlength="250" placeholder="Ищу сотрудника..."></textarea>
      <button id="btn-post">Опубликовать</button>
    </div>
  </div>
</div>

<div id="screen-result" class="screen hidden">
  <h2>Результат</h2>
  <p id="result-text" style="background:rgba(255,255,255,0.1); padding:20px; border-radius:10px;"></p>
  <button id="btn-result-ok">Продолжить</button>
</div>

<div id="rotate-hint">Поверните телефон горизонтально 📱</div>

<!-- Подключаем Three.js через CDN -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ===== СОСТОЯНИЕ ИГРЫ =====
const state = {
  money: 1000000,
  companyName: '',
  companyDesc: '',
  employees: 0,
  maxEmployees: 15,
  hireCost: 50000,
  officeLevel: 1,
  incomePerSec: 100,
  isBillionaire: false
};

// Загрузка сохранений
const saved = localStorage.getItem('companyGameSave');
if (saved) {
  const parsed = JSON.parse(saved);
  Object.assign(state, parsed);
  if (state.money > 1000000000) state.isBillionaire = true;
}

const prologTexts = [
  "Ты возвращаешься домой и замечаешь пустой ничейный участок рядом.",
  "На секунду задумываешься: а что если построить здесь свою компанию?",
  "Ты решаешь — да. Пора начать бизнес."
];
let prologIndex = 0;

const $ = (id) => document.getElementById(id);
const screens = ['screen-prolog', 'screen-create', 'screen-phone', 'screen-result'];

function showScreen(id) {
  screens.forEach(s => $(s).classList.add('hidden'));
  if (id) $(id).classList.remove('hidden');
}

function updateUI() {
  $('money-box').textContent = '$' + state.money.toLocaleString('ru-RU');
  $('staff-info').textContent = `Сотрудников: ${state.employees} / ${state.maxEmployees}`;
  
  if (state.employees > 0 && state.employees < state.maxEmployees) {
    $('btn-hire').style.display = 'block';
    $('btn-hire').textContent = `Нанять ещё ($${state.hireCost.toLocaleString('ru-RU')})`;
    $('btn-hire').style.opacity = state.money >= state.hireCost ? '1' : '0.5';
  } else {
    $('btn-hire').style.display = 'none';
  }

  if (state.employees > 0 && state.officeLevel < 5) {
    $('btn-upgrade').style.display = 'block';
    const cost = 100000 * state.officeLevel;
    $('btn-upgrade').textContent = `Улучшить офис ($${cost.toLocaleString('ru-RU')})`;
    $('btn-upgrade').style.opacity = state.money >= cost ? '1' : '0.5';
  } else {
    $('btn-upgrade').style.display = 'none';
  }

  if (state.money >= 1000000000) {
    state.isBillionaire = true;
    $('status-badge').style.display = 'block';
    $('money-box').style.color = '#fbbf24';
    $('money-box').style.textShadow = '0 0 10px #fbbf24';
  }
  
  if (state.employees > 0) {
    $('money-box').style.display = 'block';
    $('staff-info').style.display = 'block';
  }
  
  localStorage.setItem('companyGameSave', JSON.stringify(state));
}

// ===== 3D ДВИЖОК =====
const container = $('game-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 30, 100);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(20, 30, 20); // Старт для анимации

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2 - 0.05;
controls.minDistance = 10;
controls.maxDistance = 60;
controls.target.set(0, 2, 0);
controls.enabled = false; // Отключаем управление на время анимации

// Свет
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.5);
sunLight.position.set(20, 30, 10);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.left = -30;
sunLight.shadow.camera.right = 30;
sunLight.shadow.camera.top = 30;
sunLight.shadow.camera.bottom = -30;
scene.add(sunLight);

// Земля
const groundGeo = new THREE.PlaneGeometry(100, 100);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x4caf50, roughness: 0.8 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Дорога
const roadGeo = new THREE.PlaneGeometry(6, 100);
const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9 });
const road = new THREE.Mesh(roadGeo, roadMat);
road.rotation.x = -Math.PI / 2;
road.position.set(0, 0.01, 0);
road.receiveShadow = true;
scene.add(road);

function createHouse(x, z) {
  const houseGroup = new THREE.Group();
  const wallGeo = new THREE.BoxGeometry(6, 4, 6);
  const wallMat = new THREE.MeshStandardMaterial({ color: 0xf5deb3 });
  const walls = new THREE.Mesh(wallGeo, wallMat);
  walls.position.y = 2;
  walls.castShadow = true;
  walls.receiveShadow = true;
  houseGroup.add(walls);

  const roofGeo = new THREE.ConeGeometry(5, 3, 4);
  const roofMat = new THREE.MeshStandardMaterial({ color: 0x8b0000 });
  const roof = new THREE.Mesh(roofGeo, roofMat);
  roof.position.y = 5.5;
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = true;
  houseGroup.add(roof);

  const doorGeo = new THREE.BoxGeometry(1.2, 2.2, 0.1);
  const doorMat = new THREE.MeshStandardMaterial({ color: 0x5c3d1e });
  const door = new THREE.Mesh(doorGeo, doorMat);
  door.position.set(0, 1.1, 3.01);
  houseGroup.add(door);

  const windowGeo = new THREE.BoxGeometry(1.2, 1.2, 0.1);
  const windowMat = new THREE.MeshStandardMaterial({ color: 0xa0d8f0, emissive: 0x224466 });
  const win1 = new THREE.Mesh(windowGeo, windowMat);
  win1.position.set(-2, 2.5, 3.01);
  houseGroup.add(win1);
  const win2 = new THREE.Mesh(windowGeo, windowMat);
  win2.position.set(2, 2.5, 3.01);
  houseGroup.add(win2);

  houseGroup.position.set(x, 0, z);
  scene.add(houseGroup);
}

let officeGroup = null;
function createOffice(x, z) {
  if (officeGroup) scene.remove(officeGroup);
  officeGroup = new THREE.Group();
  const officeGeo = new THREE.BoxGeometry(8, 10, 8);
  const officeMat = new THREE.MeshStandardMaterial({ color: 0xd0d0d0, roughness: 0.2, metalness: 0.5 });
  const office = new THREE.Mesh(officeGeo, officeMat);
  office.position.y = 5;
  office.castShadow = true;
  office.receiveShadow = true;
  officeGroup.add(office);

  const winGeo = new THREE.BoxGeometry(1.5, 1.5, 0.1);
  const winMat = new THREE.MeshStandardMaterial({ color: 0x87ceeb, emissive: 0x112233 });
  for (let y = 2; y <= 8; y += 2.5) {
    for (let x = -2.5; x <= 2.5; x += 2.5) {
      const win = new THREE.Mesh(winGeo, winMat);
      win.position.set(x, y, 4.01);
      officeGroup.add(win);
    }
  }

  const signGeo = new THREE.BoxGeometry(6, 1, 0.2);
  const signMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, emissive: 0x1e3a8a });
  const sign = new THREE.Mesh(signGeo, signMat);
  sign.position.set(0, 9.5, 4.05);
  officeGroup.add(sign);

  officeGroup.position.set(x, 0, z);
  scene.add(officeGroup);
}

function createTree(x, z) {
  const treeGroup = new THREE.Group();
  const trunkGeo = new THREE.CylinderGeometry(0.3, 0.4, 2);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c3d1e });
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.y = 1;
  trunk.castShadow = true;
  treeGroup.add(trunk);

  const leavesGeo = new THREE.ConeGeometry(1.5, 3, 8);
  const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32 });
  const leaves = new THREE.Mesh(leavesGeo, leavesMat);
  leaves.position.y = 3;
  leaves.castShadow = true;
  treeGroup.add(leaves);

  treeGroup.position.set(x, 0, z);
  scene.add(treeGroup);
}

function createCar(x, z) {
  const carGroup = new THREE.Group();
  const bodyGeo = new THREE.BoxGeometry(2, 1, 4);
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xef4444, metalness: 0.8, roughness: 0.2 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.8;
  body.castShadow = true;
  carGroup.add(body);

  const roofGeo = new THREE.BoxGeometry(1.8, 0.8, 2);
  const roofMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.5, roughness: 0.5 });
  const roof = new THREE.Mesh(roofGeo, roofMat);
  roof.position.set(0, 1.7, -0.5);
  roof.castShadow = true;
  carGroup.add(roof);

  carGroup.position.set(x, 0, z);
  scene.add(carGroup);
}

createHouse(-10, -10);
createOffice(10, -10);
createTree(-15, 5);
createTree(-5, 10);
createTree(15, 5);
createCar(-10, -3);

// ===== МИНИ-АНИМАЦИЯ ПРОЛОГА =====
let isAnimating = false;
function startIntroAnimation() {
  isAnimating = true;
  // Плавный полет камеры от общего плана к дому
  const startPos = new THREE.Vector3(25, 25, 25);
  const endPos = new THREE.Vector3(15, 10, 15);
  const startTarget = new THREE.Vector3(0, 0, 0);
  const endTarget = new THREE.Vector3(-5, 2, -5);
  
  let t = 0;
  const duration = 3000; // 3 секунды
  const startTime = performance.now();

  function animateCamera(time) {
    if (!isAnimating) return;
    t = (time - startTime) / duration;
    if (t > 1) t = 1;
    
    // Плавность (easeInOut)
    const easeT = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    
    camera.position.lerpVectors(startPos, endPos, easeT);
    controls.target.lerpVectors(startTarget, endTarget, easeT);
    
    if (t < 1) {
      requestAnimationFrame(animateCamera);
    } else {
      isAnimating = false;
      controls.enabled = true; // Включаем управление после анимации
    }
  }
  requestAnimationFrame(animateCamera);
}

// ===== ЛОГИКА ИНТЕРФЕЙСА =====
$('btn-prolog-next').addEventListener('click', () => {
  prologIndex++;
  if (prologIndex < prologTexts.length) {
    $('prolog-text').textContent = prologTexts[prologIndex];
    // Небольшая тряска камеры для эффекта
    camera.position.x += 0.5;
    setTimeout(() => camera.position.x -= 0.5, 100);
  } else {
    if (state.companyName) {
      showScreen(null);
      updateUI();
    } else {
      showScreen('screen-create');
    }
  }
});

$('btn-create').addEventListener('click', () => {
  const name = $('input-name').value.trim();
  const desc = $('input-desc').value.trim();
  if (!name || !desc) { alert('Заполни название и описание'); return; }
  state.companyName = name;
  state.companyDesc = desc;
  showScreen('screen-phone');
});

$('btn-post').addEventListener('click', () => {
  const vacancy = $('input-vacancy').value.trim();
  if (!vacancy) { alert('Напиши текст вакансии'); return; }
  
  let result = "";
  if (vacancy.length < 40) {
    result = "❌ На твою вакансию почти никто не откликнулся. Слишком короткое описание.";
  } else if (vacancy.length < 100) {
    result = "✅ Пришёл 1 кандидат — Алексей. Он согласился на условия 50/50.";
  } else {
    result = "🔥 Пришло несколько кандидатов! Алексей пришёл первым и готов начать.";
  }
  
  $('result-text').textContent = result;
  showScreen('screen-result');
});

$('btn-result-ok').addEventListener('click', () => {
  showScreen(null);
  state.employees = 1;
  updateUI();
});

$('btn-hire').addEventListener('click', () => {
  if (state.money >= state.hireCost && state.employees < state.maxEmployees) {
    state.money -= state.hireCost;
    state.employees++;
    state.hireCost += 25000;
    updateUI();
  }
});

$('btn-upgrade').addEventListener('click', () => {
  const cost = 100000 * state.officeLevel;
  if (state.money >= cost && state.officeLevel < 5) {
    state.money -= cost;
    state.officeLevel++;
    if (officeGroup) {
      officeGroup.scale.set(1 + state.officeLevel * 0.1, 1 + state.officeLevel * 0.1, 1 + state.officeLevel * 0.1);
    }
    updateUI();
  }
});

// ===== ЦИКЛ ИГРЫ =====
setInterval(() => {
  if (state.employees > 0) {
    state.money += state.incomePerSec * state.employees;
    updateUI();
  }
}, 1000);

// ===== РЕНДЕР =====
function animate() {
  requestAnimationFrame(animate);
  if (!isAnimating) controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Старт
if (state.companyName) {
  showScreen(null);
  createOffice(10, -10);
  updateUI();
  controls.enabled = true; // Если уже играли, сразу даем управление
} else {
  showScreen('screen-prolog');
  startIntroAnimation(); // Запускаем полет камеры
}

animate();
</script>

</body>
  </html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Создай свою компанию 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff}
#game{position:fixed;inset:0;z-index:1}
#ui{position:fixed;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:15px}
#ui>*{pointer-events:auto}
#hud{display:flex;gap:10px;flex-wrap:wrap}
.box{background:rgba(10,15,30,.8);padding:8px 15px;border-radius:10px;font-weight:bold;font-size:16px;color:#4ade80;border:1px solid rgba(255,255,255,.1)}
#staff{font-size:14px;color:#fff;display:none}
#badge{font-size:12px;color:#000;background:#fbbf24;display:none;text-transform:uppercase}
#bottom{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{padding:12px 20px;border:none;border-radius:10px;font-size:14px;font-weight:bold;cursor:pointer;display:none;box-shadow:0 4px 15px rgba(0,0,0,.4)}
.btn:active{transform:scale(.95)}
.b-phone{background:#8b5cf6;color:#fff;display:block}
.b-hire{background:#3b82f6;color:#fff}
.b-up{background:#eab308;color:#000}

/* Джойстик */
#joystick-zone { position: fixed; bottom: 20px; left: 20px; width: 120px; height: 120px; z-index: 15; pointer-events: auto; display: none; }
#joystick-base { width: 100%; height: 100%; border-radius: 50%; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); position: relative; }
#joystick-stick { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.5); position: absolute; top: 35px; left: 35px; transition: transform 0.05s; }

.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.85);padding:20px;overflow-y:auto;text-align:center}
.screen.hidden{display:none}
h1,h2{font-size:26px;margin-bottom:15px}
p{font-size:16px;margin-bottom:15px;max-width:500px}
input,textarea{width:100%;max-width:400px;padding:12px;border:1px solid #444;border-radius:10px;background:rgba(255,255,255,.1);color:#fff;font-size:16px;margin-top:5px;outline:none}
button{width:100%;max-width:400px;margin-top:15px;padding:14px;border:none;border-radius:10px;background:#4ade80;color:#000;font-size:16px;font-weight:bold;cursor:pointer}
.phone{width:100%;max-width:340px;background:#fff;border-radius:20px;border:6px solid #333;overflow:hidden;color:#000;display:flex;flex-direction:column;max-height:90vh}
.ph-head{background:#3b82f6;color:#fff;padding:12px;text-align:center;font-weight:bold;font-size:16px}
.ph-body{padding:15px;display:flex;flex-direction:column;background:#f8f9fa;overflow-y:auto;flex:1}
.ph-body p{font-size:14px;margin-bottom:5px;font-weight:bold;color:#555;text-align:left}
.ph-body textarea{background:#fff;border:1px solid #ccc;color:#000;min-height:80px;margin-bottom:10px}
.ph-body button{background:#3b82f6;color:#fff;margin-top:0;padding:12px}
#notif{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#4ade80;color:#000;padding:15px 25px;border-radius:10px;font-weight:bold;font-size:16px;z-index:30;display:none;box-shadow:0 5px 20px rgba(0,0,0,.5);text-align:center;width:90%;max-width:400px}
#rot{display:none;position:fixed;inset:0;background:#000;z-index:999;align-items:center;justify-content:center;font-size:20px;text-align:center;padding:20px}
@media(orientation:portrait){#rot{display:flex}}

/* Чат */
#chat-box { position:fixed; bottom:20px; right:20px; width:300px; max-height:400px; background:#fff; border-radius:10px; display:none; flex-direction:column; z-index:25; box-shadow:0 5px 20px rgba(0,0,0,.8); overflow:hidden; color:#000; }
#chat-messages { flex:1; padding:10px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; background:#f0f0f0;}
.msg { padding:8px 12px; border-radius:10px; max-width:80%; font-size:14px; }
.msg.npc { background:#e2e8f0; align-self:flex-start; }
.msg.player { background:#3b82f6; color:#fff; align-self:flex-end; }
.chat-input-area { display:flex; padding:10px; background:#fff; border-top:1px solid #ddd; gap:5px; }
#chat-input { flex:1; padding:8px; border:1px solid #ccc; border-radius:5px; font-size:14px; }
#chat-send { width:60px; padding:8px; background:#3b82f6; color:#fff; border:none; border-radius:5px; cursor:pointer; }
</style>
</head>
<body>

<div id="game"></div>

<div id="joystick-zone">
  <div id="joystick-base">
    <div id="joystick-stick"></div>
  </div>
</div>

<div id="ui">
  <div id="hud">
    <div class="box" id="money">$1 000 000</div>
    <div class="box" id="staff">Сотрудников: 0 / 15</div>
    <div class="box" id="badge">💎 Скин Богача</div>
  </div>
  <div id="bottom">
    <button id="btn-phone" class="btn b-phone">📱 Открыть телефон</button>
    <button id="btn-hire" class="btn b-hire">Нанять ещё</button>
    <button id="btn-up" class="btn b-up">Улучшить офис</button>
  </div>
</div>

<div id="notif"></div>

<!-- Чат -->
<div id="chat-box">
  <div style="padding:10px; background:#3b82f6; color:#fff; font-weight:bold; text-align:center;">Собеседование</div>
  <div id="chat-messages"></div>
  <div class="chat-input-area">
    <input type="text" id="chat-input" placeholder="Написать...">
    <button id="chat-send">➤</button>
  </div>
</div>

<div id="scr-prolog" class="screen">
  <h2>Новая жизнь</h2>
  <p>Ты возвращаешься домой и замечаешь пустой ничейный участок рядом...</p>
  <button id="btn-next">Начать</button>
</div>

<div id="scr-phone" class="screen hidden">
  <div class="phone">
    <div class="ph-head">Соцсеть</div>
    <div class="ph-tabs" style="display:flex; background:#e5e7eb;">
      <div class="ph-tab active" id="t-cr" style="flex:1; padding:10px; text-align:center; cursor:pointer;">Создать</div>
      <div class="ph-tab" id="t-fd" style="flex:1; padding:10px; text-align:center; cursor:pointer;">Найти работу</div>
    </div>
    <div class="ph-body">
      <div id="tc" class="tab" style="display:block;">
        <p>Название компании:</p>
        <input id="in-name" placeholder="FutureTech">
        <p>Чем занимается:</p>
        <textarea id="in-desc" placeholder="Разработка игр..."></textarea>
        <button id="btn-create">Основать компанию</button>
      </div>
      <div id="tf" class="tab" style="display:none;">
        <p>Настоящие вакансии:</p>
        <div id="jobs-list"><p style="color:#666;font-size:12px">Загрузка...</p></div>
      </div>
    </div>
    <div style="padding:10px;background:#eee;text-align:center">
      <button id="btn-close" style="background:#ef4444;color:#fff;width:100%;border:none;padding:10px;border-radius:5px">Закрыть</button>
    </div>
  </div>
</div>

<div id="scr-res" class="screen hidden">
  <h2>Результат</h2>
  <p id="res-text" style="background:rgba(255,255,255,.1);padding:20px;border-radius:10px"></p>
  <button id="btn-res-ok">Продолжить</button>
</div>

<div id="rot">Поверните телефон горизонтально 📱</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const SERVER_URL = 'https://sozdai-server.onrender.com';
const st = {money:1000000,compName:'',compDesc:'',emp:0,maxEmp:15,hireCost:50000,officeLvl:1,inc:100};
const sv = localStorage.getItem('companyGameSave');
if(sv) Object.assign(st, JSON.parse(sv));

const $ = id => document.getElementById(id);
const screens = ['scr-prolog','scr-phone','scr-res'];
const show = id => {screens.forEach(s=>$(s).classList.add('hidden'));if(id)$(id).classList.remove('hidden');};

function ui(){
  $('money').textContent = '$'+st.money.toLocaleString('ru-RU');
  $('staff').textContent = `Сотрудников: ${st.emp} / ${st.maxEmp}`;
  if(st.emp>0){$('staff').style.display='block';$('money').style.display='block';}
  if(st.emp>0&&st.emp<st.maxEmp){$('btn-hire').style.display='block';$('btn-hire').textContent=`Нанять ($${st.hireCost.toLocaleString('ru-RU')})`;$('btn-hire').style.opacity=st.money>=st.hireCost?'1':'0.5';}
  else $('btn-hire').style.display='none';
  if(st.emp>0&&st.officeLvl<5){$('btn-up').style.display='block';const c=100000*st.officeLvl;$('btn-up').textContent=`Улучшить ($${c.toLocaleString('ru-RU')})`;$('btn-up').style.opacity=st.money>=c?'1':'0.5';}
  else $('btn-up').style.display='none';
  if(st.money>=1000000000){$('badge').style.display='block';$('money').style.color='#fbbf24';}
  localStorage.setItem('companyGameSave',JSON.stringify(st));
}

// ===== СЕТЬ =====
let sock, jobs=[];
sock = io(SERVER_URL);
sock.on('init-vacancies',d=>{jobs=d;renderJobs();});
sock.on('new-vacancy',j=>{jobs.unshift(j);renderJobs();});

function renderJobs(){
  const l=$('jobs-list');
  if(!sock||!sock.connected){l.innerHTML='<p style="color:red;font-size:12px">Нет связи с сервером</p>';return;}
  l.innerHTML='';
  if(jobs.length===0){l.innerHTML='<p style="color:#666;font-size:12px">Нет вакансий. Создай свою!</p>';return;}
  jobs.forEach(j=>{
    const c=document.createElement('div');
    c.style.cssText='background:#fff;border:1px solid #ddd;border-radius:8px;padding:10px;margin-bottom:10px;text-align:left;display:flex;justify-content:space-between;align-items:center';
    c.innerHTML=`<div><strong style="color:#3b82f6;font-size:14px">${j.company}</strong><br><span style="font-size:12px;color:#666">${j.desc}</span></div><button onclick="startInterview('${j.company}')" style="padding:6px 10px;font-size:12px;background:#8b5cf6;border:none;border-radius:6px;color:#fff">Откликнуться</button>`;
    l.appendChild(c);
  });
}

// ===== СОБЕСЕДОВАНИЕ =====
let chatStep = 0;
window.startInterview = (company) => {
  show(null);
  $('chat-box').style.display = 'flex';
  $('chat-messages').innerHTML = '';
  chatStep = 1;
  
  addMsg(`Здравствуйте! Вы откликнулись на вакансию в компанию "${company}". Расскажите о себе.`, 'npc');
};

function addMsg(text, type) {
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  div.textContent = text;
  $('chat-messages').appendChild(div);
  $('chat-messages').scrollTop = $('chat-messages').scrollHeight;
}

$('chat-send').onclick = () => {
  const text = $('chat-input').value.trim();
  if(!text) return;
  $('chat-input').value = '';
  addMsg(text, 'player');
  
  setTimeout(() => {
    if (chatStep === 1) {
      if (text.length < 5) {
        addMsg("Слишком короткий ответ. Вы уверены, что хотите работать?", 'npc');
      } else {
        addMsg("Звучит неплохо. А какие у вас ожидания по зарплате?", 'npc');
        chatStep = 2;
      }
    } else if (chatStep === 2) {
      addMsg("Отлично! Вы приняты. Добро пожаловать в команду!", 'npc');
      chatStep = 3;
      setTimeout(() => {
        $('chat-box').style.display = 'none';
        $('res-text').textContent = "✅ Собеседование пройдено! Вы приняты на работу.";
        show('scr-res');
      }, 2000);
    }
  }, 1000);
};

// ===== 3D =====
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 40, 150);

const cam = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);
cam.position.set(10, 15, 20);

const ren = new THREE.WebGLRenderer({antialias:true});
ren.setSize(innerWidth,innerHeight);
ren.setPixelRatio(Math.min(devicePixelRatio,2));
ren.shadowMap.enabled=true;
ren.shadowMap.type=THREE.PCFSoftShadowMap;
$('game').appendChild(ren.domElement);

const controls = new OrbitControls(cam, ren.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.maxPolarAngle = Math.PI / 2 - 0.05;
controls.minDistance = 5;
controls.maxDistance = 30;
controls.target.set(0, 2, 0);

scene.add(new THREE.AmbientLight(0xffffff,0.6));
const sun = new THREE.DirectionalLight(0xfff5e6,1.5);
sun.position.set(30,40,20);
sun.castShadow=true;
sun.shadow.mapSize.width=2048;
sun.shadow.mapSize.height=2048;
sun.shadow.camera.left=-60;
sun.shadow.camera.right=60;
sun.shadow.camera.top=60;
sun.shadow.camera.bottom=-60;
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(300,300), new THREE.MeshStandardMaterial({color:0x4caf50, roughness:0.8}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

const roadMat = new THREE.MeshStandardMaterial({color:0x333333,roughness:0.9});
const road1 = new THREE.Mesh(new THREE.PlaneGeometry(12, 300), roadMat);
road1.rotation.x=-Math.PI/2; road1.position.y=0.01; road1.receiveShadow=true; scene.add(road1);
const road2 = new THREE.Mesh(new THREE.PlaneGeometry(300, 12), roadMat);
road2.rotation.x=-Math.PI/2; road2.position.y=0.01; road2.receiveShadow=true; scene.add(road2);

let pers;
function mkPers(x,z){
  pers=new THREE.Group();
  const b=new THREE.Mesh(new THREE.CapsuleGeometry(0.4,1,4,8),new THREE.MeshStandardMaterial({color:0x3b82f6}));
  b.position.y=1.2; b.castShadow=true; pers.add(b);
  const h=new THREE.Mesh(new THREE.SphereGeometry(0.35,16,16),new THREE.MeshStandardMaterial({color:0xffccaa}));
  h.position.y=2.1; h.castShadow=true; pers.add(h);
  pers.position.set(x,0,z); scene.add(pers);
}

function mkHouse(x, z, color) {
  const g=new THREE.Group();
  const w=new THREE.Mesh(new THREE.BoxGeometry(8,6,8),new THREE.MeshStandardMaterial({color:0xf5deb3}));
  w.position.y=3; w.castShadow=true; w.receiveShadow=true; g.add(w);
  const r=new THREE.Mesh(new THREE.ConeGeometry(7,4,4),new THREE.MeshStandardMaterial({color:color}));
  r.position.y=8; r.rotation.y=Math.PI/4; r.castShadow=true; g.add(r);
  const d=new THREE.Mesh(new THREE.BoxGeometry(1.5,3,0.2),new THREE.MeshStandardMaterial({color:0x5c3d1e}));
  d.position.set(0,1.5,4.05); g.add(d);
  g.position.set(x,0,z); scene.add(g);
  return g;
}

function mkOffice(x, z, color) {
  const g=new THREE.Group();
  const w=new THREE.Mesh(new THREE.BoxGeometry(10,12,10),new THREE.MeshStandardMaterial({color:0xdddddd}));
  w.position.y=6; w.castShadow=true; w.receiveShadow=true; g.add(w);
  // Вывеска
  const sign=new THREE.Mesh(new THREE.BoxGeometry(8,2,0.5),new THREE.MeshStandardMaterial({color:color}));
  sign.position.set(0, 10, 5.1); g.add(sign);
  g.position.set(x,0,z); scene.add(g);
  return g;
}

// Дома
mkHouse(-40, -40, 0x8b0000);
mkHouse(40, -40, 0x1e3a8a);
mkHouse(-40, 40, 0x166534);
mkHouse(40, 40, 0x4c1d95);

// Офисы рядом с домами (свои)
mkOffice(-20, -40, 0x8b0000);
mkOffice(20, -40, 0x1e3a8a);
mkOffice(-20, 40, 0x166534);
mkOffice(20, 40, 0x4c1d95);

mkPers(-40, -20);

// ===== УПРАВЛЕНИЕ =====
let moveX = 0, moveY = 0;
const joyZone = $('joystick-zone');
const joyBase = $('joystick-base');
const joyStick = $('joystick-stick');
let joyActive = false;

function updateJoystick(e) {
  if(!joyActive) return;
  e.preventDefault();
  const touch = e.touches ? e.touches[0] : e;
  const rect = joyBase.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  let dx = touch.clientX - cx;
  let dy = touch.clientY - cy;
  const maxDist = rect.width/2;
  const dist = Math.sqrt(dx*dx+dy*dy);
  
  if (dist > maxDist) { dx = dx/dist*maxDist; dy = dy/dist*maxDist; }
  
  joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
  moveX = dx / maxDist;
  moveY = dy / maxDist;
}

joyZone.addEventListener('touchstart', e => { joyActive = true; updateJoystick(e); }, {passive:false});
joyZone.addEventListener('touchmove', updateJoystick, {passive:false});
joyZone.addEventListener('touchend', () => {
  joyActive = false;
  joyStick.style.transform = 'translate(0px, 0px)';
  moveX = 0; moveY = 0;
});

// ===== ИНТЕРФЕЙС =====
$('btn-next').onclick=()=>{show(null);joyZone.style.display='block';controls.target.copy(pers.position);};
$('t-cr').onclick=()=>{$('t-cr').classList.add('active');$('t-fd').classList.remove('active');$('tc').style.display='block';$('tf').style.display='none';};
$('t-fd').onclick=()=>{$('t-fd').classList.add('active');$('t-cr').classList.remove('active');$('tf').style.display='block';$('tc').style.display='none';renderJobs();};
$('btn-phone').onclick=()=>{show('scr-phone');renderJobs();};
$('btn-close').onclick=()=>show(null);
$('btn-create').onclick=()=>{
  const n=$('in-name').value.trim(),d=$('in-desc').value.trim();
  if(!n||!d){alert('Заполни поля');return;}
  if(sock&&sock.connected)sock.emit('add-vacancy',{company:n,desc:d});
  st.compName=n;st.compDesc=d;ui();show(null);
  const nt=$('notif');nt.textContent="🏢 Компания создана!";nt.style.background='#4ade80';nt.style.display='block';setTimeout(()=>nt.style.display='none',3000);
};
$('btn-res-ok').onclick=()=>{show(null);};

$('btn-hire').onclick=()=>{if(st.money>=st.hireCost&&st.emp<st.maxEmp){st.money-=st.hireCost;st.emp++;st.hireCost+=25000;ui();}};
$('btn-up').onclick=()=>{const c=100000*st.officeLvl;if(st.money>=c&&st.officeLvl<5){st.money-=c;st.officeLvl++;ui();}};

setInterval(()=>{if(st.emp>0){st.money+=st.inc*st.emp;ui();}},1000);

function loop(){
  requestAnimationFrame(loop);
  
  if(pers){
    if (moveX !== 0 || moveY !== 0) {
      const speed = 0.3;
      pers.position.x += moveX * speed;
      pers.position.z += moveY * speed;
      const angle = Math.atan2(moveX, moveY);
      pers.rotation.y = angle;
    }
    
    // Камера следует за персонажем
    controls.target.lerp(pers.position, 0.1);
  }
  
  controls.update();
  ren.render(scene,cam);
}

addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);});

ui();
show('scr-prolog');
loop();
</script>
</body>
      </html>
